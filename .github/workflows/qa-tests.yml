name: QA Automation Demo

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start FastAPI demo backend
        run: |
          mkdir -p reports
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > reports/api-server.log 2>&1 &
          python - <<'PY'
          import time
          import requests
          for _ in range(30):
              try:
                  if requests.get("http://127.0.0.1:8000/health", timeout=2).status_code == 200:
                      print("FastAPI is ready")
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("FastAPI did not start")
          PY

      - name: Run tests
        run: pytest -q --junitxml=reports/junit.xml

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-results
          path: reports/
          if-no-files-found: warn
